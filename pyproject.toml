[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onc"
version = "0.5.0"
description = "An autonomous AI scientist for pediatric cancer gene dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "richardoden" }]
keywords = ["pediatric-cancer", "oncology", "crispr", "depmap", "drug-discovery", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/RichardOden/onc"
Repository = "https://github.com/RichardOden/onc"
Issues = "https://github.com/RichardOden/onc/issues"

[project.scripts]
onc = "onc.cli:main"

[tool.setuptools]
packages = ["onc", "onc.sources"]

[tool.setuptools.package-data]
onc = ["../data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
